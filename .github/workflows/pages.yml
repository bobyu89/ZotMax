name: pages

# Publishes site/ (install wizard index.html + literature search search.html + appraisal checklists appraisal.html) to GitHub Pages: https://bobyu89.github.io/ZotMax/
# appraisal.html loads the shared checklist catalog, copied from content/appraisal-tools.js at deploy time (site/appraisal-tools.js is git-ignored).
# search.html loads the shared query checker (檢索式體檢), copied from content/query-check.js the same way (site/query-check.js is git-ignored).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/appraisal-tools.js"
      - "content/query-check.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared appraisal checklist catalog into site/
        run: cp content/appraisal-tools.js site/appraisal-tools.js
      - name: Copy shared query checker into site/
        run: cp content/query-check.js site/query-check.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
