<?xml version="1.0" encoding="UTF-8"?>
<!--
	匯出給 Gemini Notebook: the export window (content/gemini-export.js dialog() opens it and renderDialog() fills it).
	Layout and tokens: DESIGN.md (Export window). It borrows the 文獻自動分類 window's stylesheet (classify-review.css:
	tokens, head, list, foot) and adds the folder row, the options and the source count (gemini-export.css).
-->
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-bridge/content/classify-review.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-bridge/content/gemini-export.css" type="text/css"?>
<window id="zotero-bridge-gemini-window"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	title="匯出給 Gemini Notebook"
	width="620"
	height="600"
	persist="width height screenX screenY">
	<html:div id="zb-gemini" class="zb-classify zb-gemini"/>
</window>
