<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群島地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  ZotMax 星球地圖 (content/planet.js writes this file with the data below filled in).
  One Zotero collection is the planet; its sub-collections are the islands. Everything is drawn on a
  canvas from window.PLANET; it makes no network request at all (system fonts, rounded where the system has them).
-->
<style>
/* Layout: the island map takes the middle, the chosen island on the left, the island log on the right, the tour below */
:root {
  --bg: #f4f0e6;
  --panel: #fffdf8;
  --panel-2: #f6f1e6;
  --ink: #213439;
  --muted: #6b7570;
  --line: #e7dfcd;
  --warm: #e07a4f;
  --hint-bg: #fff1dc;
  --hint-ink: #8a5420;
  --accent: #7a6be0;
  --accent-soft: #eeebff;
  --good: #3c9d6a;
  --warn: #d6843a;
  --shadow: 0 10px 30px rgba(38, 78, 78, .12), 0 2px 6px rgba(38, 78, 78, .06);
  --radius: 22px;
  --display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --body: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1c21; --panel: #16292f; --panel-2: #1c3239; --ink: #e4efed; --muted: #9db3b5; --line: #29434a;
    --accent: #ab9ff6; --accent-soft: #2b2a55; --good: #6ccb97; --warn: #f2ab62;
    --warm: #f29a73; --hint-bg: #3a2c1f; --hint-ink: #f6c995;
    --shadow: 0 10px 30px rgba(0, 0, 0, .40); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1c21; --panel: #16292f; --panel-2: #1c3239; --ink: #e4efed; --muted: #9db3b5; --line: #29434a;
  --accent: #ab9ff6; --accent-soft: #2b2a55; --good: #6ccb97; --warn: #f2ab62;
  --warm: #f29a73; --hint-bg: #3a2c1f; --hint-ink: #f6c995;
  --shadow: 0 10px 30px rgba(0, 0, 0, .40); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.55;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1340px; margin: 0 auto; display: grid; gap: 14px; }
.note { font-size: 12px; color: var(--muted); }
.note b { color: var(--warn); }
header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: var(--radius); padding: 10px 18px 10px 10px; box-shadow: var(--shadow); min-width: 0; }
.brand .logo { width: 46px; height: 46px; flex: none; border-radius: 16px; background: radial-gradient(circle at 35% 30%, #fff 0 12%, #b7aef7 13% 55%, #7a6be0 56%); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.brand h1 { font-family: var(--display); font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.kpis { display: flex; flex-wrap: wrap; gap: 6px; background: var(--panel); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow); }
.kpi { padding: 4px 14px; text-align: center; min-width: 74px; border-radius: 16px; }
.kpi b { display: block; font-family: var(--display); font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.kpi.hot { background: var(--accent-soft); }
.kpi.hot b { color: var(--accent); }
.stage { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
.panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.panel h2 { font-family: var(--display); font-size: 22px; margin: 2px 0 6px; line-height: 1.2; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.lv { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.devbar { height: 12px; border-radius: 99px; background: var(--panel-2); overflow: hidden; margin: 10px 0 4px; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.devbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #8fd6a8, var(--accent)); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.mini div { background: var(--panel-2); border-radius: 16px; padding: 8px 10px; }
.mini b { display: block; font-family: var(--display); font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.mini span { font-size: 11px; color: var(--muted); }
.formula { font-size: 12px; color: var(--muted); }
.spark { display: block; width: 100%; height: 34px; margin-top: 6px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }
.quests { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 2px; }
.quests li { font-size: 12.5px; padding: 3px 0; }
.quests li.done { color: var(--muted); text-decoration: line-through; }
.quests a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hint { margin-top: 8px; padding: 7px 11px; border-radius: 12px; background: var(--hint-bg); color: var(--hint-ink); font-size: 12.5px; font-weight: 700; }
.go { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; border: 0; border-radius: 16px; padding: 11px 18px; background: var(--warm); color: #fff; font: 800 14px var(--body); cursor: pointer; box-shadow: 0 6px 16px rgba(224, 122, 79, .28); }
.go:hover { filter: brightness(1.05); }
.clock { align-self: center; padding: 0 8px 0 6px; font: 700 12px var(--display); color: #213439; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.squares { letter-spacing: 1px; font-size: 13px; word-break: break-all; }
.sec { margin-top: 12px; }
.sec h3 { font-size: 13px; margin: 0 0 4px; }
.gaps { margin: 0; padding-left: 18px; }
.gaps li { margin: 2px 0; }
.open { display: inline-flex; gap: 6px; align-items: center; margin-top: 14px; padding: 8px 14px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; }
.mapbox { position: relative; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
canvas { display: block; width: 100%; height: 580px; cursor: pointer; touch-action: manipulation; }
.maptools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; background: rgba(255,255,255,.88); border-radius: 99px; padding: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.maptools button { border: 0; background: transparent; border-radius: 99px; padding: 5px 12px; font: 700 12px var(--body); color: #213439; cursor: pointer; }
.maptools button[aria-pressed="true"] { background: #213439; color: #fff; }
.snap { position: absolute; right: 12px; top: 12px; border: 0; border-radius: 99px; padding: 6px 12px; background: rgba(255,255,255,.88); color: #213439; font: 700 12px var(--body); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.legend { position: absolute; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); color: #213439; border-radius: 16px; padding: 7px 12px; font-size: 11px; line-height: 1.7; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 2px 0 6px; }
.log { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; max-height: 500px; overflow: auto; }
.log li { display: grid; grid-template-columns: 44px 22px 1fr; gap: 4px; padding: 6px 2px; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .day { grid-column: 1 / -1; font-size: 11px; color: var(--muted); border: 0; padding-top: 10px; font-weight: 700; }
.log .empty { grid-template-columns: 1fr; color: var(--muted); }
.tour { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.tour .text { flex: 1 1 340px; min-width: 0; }
.tour .step { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: .08em; }
.tour p { margin: 2px 0 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button.b { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 7px 16px; font: 700 13px var(--body); cursor: pointer; }
button.b.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:focus-visible, a:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 5px 12px; font: 500 12.5px var(--body); cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
@media (max-width: 1100px) {
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .mapbox { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 640px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  canvas { height: 440px; }
  .kpi { min-width: 60px; padding: 4px 8px; }
  .kpi b { font-size: 20px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="note" id="note"></div>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div style="min-width:0">
        <h1 id="title"></h1>
        <p id="question"></p>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="stage">
    <aside class="panel" id="island" aria-live="polite"></aside>
    <div class="mapbox">
      <canvas id="map" tabindex="0" aria-label="群島地圖：點一座島看詳細資料，或用左右方向鍵切換" aria-describedby="srlist"></canvas>
      <ul class="sr-only" id="srlist"></ul>
      <div class="maptools" role="group" aria-label="時段">
        <span class="clock" id="clock" title="依現在時間自動切換白天、黃昏、夜晚"></span>
        <button type="button" data-time="day" aria-pressed="true">白天</button>
        <button type="button" data-time="dusk" aria-pressed="false">黃昏</button>
        <button type="button" data-time="night" aria-pressed="false">夜晚</button>
      </div>
      <button type="button" class="snap" id="snap" title="把目前的地圖存成 PNG（給投影片或和指導教授討論用）">🖼️ 下載圖片</button>
      <div class="legend">屋頂<span class="dot" style="background:#8f80ec"></span>已讀<span class="dot" style="background:#f2b24c"></span>閱讀中<span class="dot" style="background:#f3efe7;border:1px solid #ccc"></span>待讀<br>屋子越高＝證據等級越強 · <span style="color:#e07a4f">▶</span> 旗子＝本週任務</div>
    </div>
    <aside class="panel">
      <div class="eyebrow">島嶼日誌</div>
      <ol class="log" id="log"></ol>
    </aside>
  </div>

  <div class="panel"><div class="chips" id="chips" role="group" aria-label="選一座島"></div></div>

  <div class="panel tour">
    <div class="text">
      <div class="step" id="tourStep"></div>
      <p id="tourText"></p>
    </div>
    <div class="btns">
      <button type="button" class="b" id="prev">← 上一站</button>
      <button type="button" class="b primary" id="next">下一站 →</button>
    </div>
  </div>
</div>

<script>
window.PLANET = /*ZOTMAX_DATA*/null;
</script>
<script>
(function () {
  const D = window.PLANET;
  if (!D) return;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[c]);
  const STAGES = [[75, 4, "🏙️", "城鎮"], [50, 3, "🏘️", "聚落"], [25, 2, "🏕️", "開墾中"], [0, 1, "🌱", "荒島"]];
  const stageOf = d => STAGES.find(([min]) => d >= min);
  const ROOF = { read: "#8f80ec", reading: "#f2b24c", todo: "#f3efe7" };

  // ---------- head, KPIs, log, chips ----------
  document.title = D.title || "群島地圖";
  $("title").textContent = D.title;
  $("question").textContent = D.question || "";
  $("note").innerHTML = D.note || "";
  const K = D.kpis || {};
  $("kpis").innerHTML = [[K.papers, "文獻"], [K.islands, "座島"], [K.readPct + "%", "已讀"], [K.newWeek, "本週新增"], [K.gaps, "缺口"], ...(D.harbor ? [[D.harbor.pending, "港口待看", true]] : [])]
    .map(([v, l, hot]) => `<div class="kpi${hot ? " hot" : ""}"><b>${esc(v)}</b><span>${l}</span></div>`).join("");
  $("log").innerHTML = (D.log || []).length
    ? D.log.map(e => e.day ? `<li class="day">${esc(e.day)}</li>` : `<li><time>${esc(e.t)}</time><span aria-hidden="true">${esc(e.i)}</span><span>${esc(e.s)}</span></li>`).join("")
    : `<li class="empty">最近 14 天還沒有紀錄。讀完文獻、核對評讀、匯入新文獻都會記在這裡。</li>`;
  const hub = { id: "hub", hub: true, name: "研究問題" };
  const islands = D.islands || [];
  $("chips").innerHTML = [["hub", "🪐 研究問題"], ...islands.map(i => [i.id, `${stageOf(i.dev)[2]} ${i.name}`]), ...(D.harbor ? [["harbor", "⛵ 港口"]] : [])]
    .map(([id, t]) => `<button type="button" data-id="${esc(id)}" aria-pressed="false">${esc(t)}</button>`).join("");
  $("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) select(b.dataset.id); });
  // 🎯 this week's quests (all, or one island's)
  const QUESTS = (D.quests && D.quests.items) || [];
  const openOn = name => QUESTS.some(q => !q.done && q.island === name);
  function questList(items, title) {
    if (!items.length) return "";
    const done = items.filter(q => q.done).length;
    return `<div class="sec"><h3>🎯 ${title}（${done}／${items.length}）</h3><ul class="quests">${items.map(q =>
      `<li class="${q.done ? "done" : ""}">${q.done ? "✅" : "⬜"} ${esc(q.verb)} ${q.link ? `<a href="${esc(q.link)}">${esc(q.title)}</a>` : esc(q.title)}${title === "本週任務" ? ` · ${esc(q.island)}` : ""}</li>`).join("")}</ul></div>`;
  }
  // The map in words, for screen readers
  $("srlist").innerHTML = islands.map((i, k) => `<li>${k + 1}. ${esc(i.name)}：LV${stageOf(i.dev)[1]} ${stageOf(i.dev)[3]}，開發度 ${i.dev}，${i.papers} 篇、已讀 ${i.read}${i.hint ? `；${esc(i.hint)}` : ""}${i.gaps && i.gaps.length ? `；缺口：${esc(i.gaps.join("、"))}` : ""}</li>`).join("")
    + (D.harbor ? `<li>港口：搜尋機器人待看 ${D.harbor.pending} 篇</li>` : "")
    + (QUESTS.length ? `<li>本週任務：${QUESTS.map(q => `${q.done ? "已完成" : "未完成"} ${esc(q.verb)}《${esc(q.title)}》（${esc(q.island)}）`).join("；")}</li>` : "");

  // ---------- the chosen island ----------
  let selected = "hub";
  function panel(id) {
    const el = $("island");
    const open = (link, text) => link ? `<a class="open" href="${esc(link)}">${text} →</a>` : "";
    if (id === "harbor" && D.harbor) {
      const h = D.harbor;
      el.innerHTML = `<div class="eyebrow">港口</div><h2>⛵ 搜尋機器人</h2>
        <div class="mini"><div><b>${h.pending}</b><span>待看</span></div><div><b>${h.high}</b><span>⭐⭐⭐</span></div><div><b>${h.imported}</b><span>已靠岸</span></div></div>
        <p class="formula">每天查 PubMed、每週查引用核心文獻的新研究，依你的 PICO 排序。你勾選的才會靠岸（匯入 Zotero），由你決定放在哪座島。</p>
        ${open(h.link, "在 Obsidian 開啟清單")}`;
    }
    else if (id === "hub") {
      el.innerHTML = `<div class="eyebrow">星球中心</div><h2>${esc(D.title)}</h2>
        ${(D.pico || []).map(([k, v]) => `<div><b>${esc(k)}</b>：${esc(v)}</div>`).join("") || `<p class="formula">這個分類還沒有 PICO 問題卡。</p>`}
        ${questList(QUESTS, "本週任務")}
        <p class="formula" style="margin-top:12px">每座島是一個 Zotero 子分類。開發度 = 已讀 40% ＋ 評讀已核對 30% ＋ 有 AI 筆記 30%：🌱 荒島 &lt;25、🏕️ 開墾中 25–49、🏘️ 聚落 50–74、🏙️ 城鎮 ≥75。</p>
        <button type="button" class="go" id="go">跟著導覽逛一圈 <span aria-hidden="true">↗</span></button>
        <div>${open(D.link, "在 Obsidian 開啟星球頁")}</div>`;
      $("go").onclick = () => { tour(0); document.querySelector(".tour").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); };
    }
    else {
      const is = islands.find(i => i.id === id);
      if (!is) return;
      const st = stageOf(is.dev);
      const links = (D.bridges || []).filter(b => b.a === id || b.b === id), seasNear = (D.seas || []).filter(x => x.near === id);
      const nameOf = x => x === "hub" ? (D.short || "研究問題") : (islands.find(i => i.id === x) || {}).name || x;
      el.innerHTML = `<div class="eyebrow">島 · Zotero 子分類</div>
        <h2>${esc(is.name)}</h2>
        <span class="lv">LV${st[1]} ${st[2]} ${st[3]}</span>
        <div class="devbar" role="img" aria-label="開發度 ${is.dev}"><i style="width:${Math.max(4, is.dev)}%"></i></div>
        <div class="formula">開發度 ${is.dev}：已讀 ${is.read}／${is.papers}、評讀核對 ${is.verified}、AI 筆記 ${is.ai}</div>
        ${is.hint ? `<div class="hint">⬆️ ${esc(is.hint)}</div>` : ""}
        ${spark(is.trend)}
        <div class="mini"><div><b>${is.papers}</b><span>篇文獻</span></div><div><b>${is.best ? "L" + is.best : "—"}</b><span>最強證據</span></div><div><b>${is.gaps.length}</b><span>缺口</span></div></div>
        ${is.design ? `<div class="sec"><h3>研究設計</h3>${esc(is.design)}</div>` : ""}
        ${is.dirs ? `<div class="sec"><h3>結論方向（AI 初判）</h3><span class="squares">${esc(is.dirs)}</span></div>` : ""}
        ${links.length ? `<div class="sec"><h3>🌉 橋（共用的概念卡）</h3>${links.map(b => `<div>${esc(b.label)} → ${esc(nameOf(b.a === id ? b.b : b.a))}</div>`).join("")}</div>` : ""}
        ${seasNear.length ? `<div class="sec"><h3>🌊 附近的未探索海域</h3>${seasNear.map(x => `<div>${esc(x.text)}</div>`).join("")}</div>` : ""}
        ${questList(QUESTS.filter(q => q.island === is.name), "這座島的本週任務")}
        ${is.prompts && is.prompts.length ? `<div class="sec"><h3>📝 寫文獻探討時要回答</h3><ul class="gaps">${is.prompts.map(q => `<li>${esc(q)}</li>`).join("")}</ul>${
          is.key && is.key.length ? `<div class="formula" style="margin-top:6px">先讀、先引用：${is.key.map(k => k.url ? `<a href="${esc(k.url)}">${esc(k.title)}</a>` : esc(k.title)).join("；")}</div>` : ""}</div>` : ""}
        <div class="sec"><h3>🧭 這座島的缺口</h3>${is.gaps.length ? `<ul class="gaps">${is.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : `<span class="formula">目前沒有規則找到的缺口</span>`}</div>
        ${open(is.link, "在 Obsidian 開啟島頁")}`;
